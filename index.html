<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wheel of Fate</title>

<style>

*{box-sizing:border-box}

body{margin:0;background:#080812;color:#fff;font-family:Arial,sans-serif;text-align:center}

.app{max-width:900px;margin:auto;padding:18px}

h1{font-size:38px;margin:8px 0}

.subtitle{color:#aaa;margin-bottom:20px}

.card{background:#151522;border:1px solid #29293d;border-radius:20px;padding:18px;margin:18px 0}

button{background:#704cff;color:white;border:0;border-radius:12px;padding:14px 18px;margin:6px;font-weight:bold;font-size:16px}

button:disabled{opacity:.45}

.secondary{background:#29293d}

.wheelWrap{position:relative;width:300px;margin:15px auto}

.wheel{

width:290px;height:290px;border-radius:50%;border:7px solid white;

margin:auto;box-shadow:0 0 35px #704cff66;

transition:transform 3.5s cubic-bezier(.12,.8,.16,1);

position:relative;overflow:hidden;

}

.pointer{font-size:36px;line-height:30px;position:relative;z-index:5}

.wheelCenter{

position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);

width:65px;height:65px;border-radius:50%;background:#10101b;

border:4px solid white;display:flex;align-items:center;justify-content:center;

font-size:12px;font-weight:bold;z-index:3;

}

.segmentLabels{

position:absolute;inset:0;z-index:2;pointer-events:none;

}

.segmentLabel{

position:absolute;

font-size:10px;

font-weight:bold;

width:70px;

transform:translate(-50%,-50%);

text-shadow:0 1px 3px #000;

}

.result{min-height:55px;font-size:20px;font-weight:bold;margin:12px}

.reveal{font-size:27px;color:#ffd43b}

.options{display:grid;grid-template-columns:1fr 1fr;gap:7px;text-align:left;margin-top:15px}

.option{background:#222235;padding:9px;border-radius:9px;font-size:13px}

.option b{display:block}

.option span{color:#aaa}

.characterGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.stat{background:#222235;padding:12px;border-radius:10px;text-align:left}

.stat small{color:#999}

.stat strong{display:block;margin-top:3px;font-size:17px}

.battleLog{text-align:left;background:#090910;border-radius:12px;padding:14px;line-height:1.55;min-height:80px}

.winner{font-size:30px;color:#ffd43b}

@media(max-width:600px){

h1{font-size:30px}

.wheel{width:260px;height:260px}

.wheelWrap{width:270px}

.options{grid-template-columns:1fr}

.characterGrid{grid-template-columns:1fr}

button{width:94%}

}

</style>

</head>

<body>

<div class="app">

<h1>🎡 WHEEL OF FATE</h1>

<div class="subtitle">Every spin could create something legendary.</div>

<div class="card">

<h2 id="categoryTitle">Choose a character</h2>

<div class="pointer">▼</div>

<div class="wheelWrap">

<div id="wheel" class="wheel">

<div id="segmentLabels" class="segmentLabels"></div>

<div class="wheelCenter">FATE</div>

</div>

</div>

<div id="result" class="result">Ready.</div>

<button onclick="generate('A')">🎡 Generate Character A</button>

<button onclick="generate('B')">🎡 Generate Character B</button>

<div id="options"></div>

</div>

<div class="card">

<h2>🅰️ Character A</h2>

<div id="characterA" class="characterGrid">

<div class="stat">Empty slot.</div>

</div>

</div>

<div class="card">

<h2>🅱️ Character B</h2>

<div id="characterB" class="characterGrid">

<div class="stat">Empty slot.</div>

</div>

</div>

<div class="card">

<h2>⚔️ FATE BATTLE</h2>

<p>Two characters enter. Only one leaves victorious.</p>

<button onclick="battle()">⚔️ LET THEM FIGHT</button>

<div id="battleResult">Generate both characters first.</div>

</div>

</div>

<script>

const categories={

"Race":[

["Wanderer",35,10],

["Beastkin",25,20],

["Vampire",18,35],

["Dragon Tamer",10,55],

["Demigod",6,75],

["Celestial",4,100],

["Eternal",2,130]

],

"Strength":[

["Street Brawler",35,10],

["Warrior",25,20],

["Monster",18,35],

["Titan",10,55],

["World Breaker",6,75],

["Star Crusher",4,100],

["Godhand",2,130]

],

"IQ":[

["Sharp",35,10],

["Strategist",25,20],

["Genius",18,35],

["Mastermind",10,55],

["Grand Sage",6,75],

["Cosmic Mind",4,100],

["Omniscient",2,130]

],

"Durability":[

["Mortal",35,10],

["Ironhide",25,20],

["Juggernaut",18,35],

["Colossus",10,55],

["Immortal",6,75],

["Worldshield",4,100],

["Eternal",2,130]

],

"Special Power":[

["Shadowstep",30,10],

["Beast Command",25,20],

["Elemental Fury",18,35],

["Soul Manipulation",10,55],

["Time Bending",6,75],

["Reality Warping",4,100],

["Fate Manipulation",2,140]

],

"Extra Power":[

["Enhanced Reflexes",30,10],

["Regeneration",25,20],

["Illusion Casting",18,35],

["Telekinesis",10,55],

["Energy Absorption",6,75],

["Dimensional Control",4,100],

["Causality Break",2,140]

],

"Power Reserves":[

["Flicker",35,10],

["Spark",25,20],

["Deep Well",18,35],

["Overcharged",10,55],

["Bottomless",6,75],

["Infinite",4,100],

["Limitless",2,130]

],

"Fight Skill":[

["Amateur",35,10],

["Scrapper",25,20],

["Trained Fighter",18,35],

["Elite Warrior",10,55],

["Master",6,75],

["Grandmaster",4,100],

["Perfect Combatant",2,130]

]

};

const order=[

"Race","Strength","IQ","Durability",

"Special Power","Extra Power","Power Reserves","Fight Skill"

];

let characters={A:null,B:null};

let spinning=false;

function pick(list){

let total=list.reduce((a,x)=>a+x[1],0);

let r=Math.random()*total;

for(const x of list){

r-=x[1];

if(r<=0)return x;

}

return list[list.length-1];

}

function showOptions(category){

const list=categories[category];

let html="<h3>🎯 Current Wheel Odds</h3><div class='options'>";

for(const x of list){

html+=`<div class="option"><b>${x[0]}</b><span>${x[1]}% chance</span></div>`;

}

html+="</div>";

document.getElementById("options").innerHTML=html;

}

function drawWheel(category){

const list=categories[category];

let start=0;

let parts=[];

let labels="";

for(const x of list){

let end=start+x[1]/100*360;

parts.push(`hsl(${start},75%,55%) ${start}deg ${end}deg`);

let middle=(start+end)/2;

let radius=105;

let rad=(middle-90)*Math.PI/180;

let left=145+Math.cos(rad)*radius;

let top=145+Math.sin(rad)*radius;

labels+=`<div class="segmentLabel" style="left:${left}px;top:${top}px">${x[0]}<br>${x[1]}%</div>`;

start=end;

}

document.getElementById("wheel").style.background=`conic-gradient(${parts.join(",")})`;

document.getElementById("segmentLabels").innerHTML=labels;

}

function display(slot){

const c=characters[slot];

let html="";

for(const cat of order){

if(c.stats[cat]){

html+=`

<div class="stat">

<small>${cat}</small>

<strong>${c.stats[cat][0]}</strong>

</div>`;

}

}

document.getElementById("character"+slot).innerHTML=html;

}

function generate(slot){

if(spinning)return;

spinning=true;

characters[slot]={stats:{}};

document.getElementById("categoryTitle").textContent=

"Generating Character "+slot;

runSpin(slot,0);

}

function runSpin(slot,index){

if(index>=order.length){

spinning=false;

document.getElementById("categoryTitle").textContent=

"Character "+slot+" Complete";

document.getElementById("result").innerHTML=

`<span class="reveal">🔥 FATE HAS SPOKEN.</span>`;

display(slot);

return;

}

const category=order[index];

const chosen=pick(categories[category]);

drawWheel(category);

showOptions(category);

document.getElementById("categoryTitle").textContent=category;

document.getElementById("result").textContent="THE WHEEL IS SPINNING...";

const wheel=document.getElementById("wheel");

wheel.style.transition="none";

wheel.style.transform="rotate(0deg)";

void wheel.offsetWidth;

wheel.style.transition="transform 3.5s cubic-bezier(.12,.8,.16,1)";

wheel.style.transform=`rotate(${1440+Math.random()*720}deg)`;

setTimeout(()=>{

characters[slot].stats[category]=chosen;

document.getElementById("result").innerHTML=

`<span class="reveal">${chosen[0]}</span><br>${chosen[1]}% chance`;

display(slot);

setTimeout(()=>runSpin(slot,index+1),900);

},3700);

}

function battle(){

const A=characters.A;

const B=characters.B;

const out=document.getElementById("battleResult");

if(!A||!B||Object.keys(A.stats).length<8||Object.keys(B.stats).length<8){

out.innerHTML="<p>Both characters must finish generating first.</p>";

return;

}

let a=0,b=0,log=[];

a+=A.stats.Strength[2];

b+=B.stats.Strength[2];

a+=A.stats.Durability[2];

b+=B.stats.Durability[2];

a+=A.stats.IQ[2]*.7;

b+=B.stats.IQ[2]*.7;

a+=A.stats["Fight Skill"][2]*1.3;

b+=B.stats["Fight Skill"][2]*1.3;

a+=A.stats["Special Power"][2]*1.3;

b+=B.stats["Special Power"][2]*1.3;

a+=A.stats["Extra Power"][2];

b+=B.stats["Extra Power"][2];

a+=A.stats["Power Reserves"][2]*.8;

b+=B.stats["Power Reserves"][2]*.8;

a+=A.stats.Race[2]*.8;

b+=B.stats.Race[2]*.8;

a*=.9+Math.random()*.2;

b*=.9+Math.random()*.2;

log.push(`⚔️ The battle begins: ${A.stats.Race[0]} vs ${B.stats.Race[0]}.`);

if(A.stats["Fight Skill"][2]>B.stats["Fight Skill"][2])

log.push("🥋 Character A controls the opening exchange with superior combat skill.");

else if(B.stats["Fight Skill"][2]>A.stats["Fight Skill"][2])

log.push("🥋 Character B controls the opening exchange with superior combat skill.");

else

log.push("🥋 Their combat skills are evenly matched.");

if(A.stats["Special Power"][2]>B.stats["Special Power"][2])

log.push(`✨ Character A unleashes ${A.stats["Special Power"][0]}.`);

else

log.push(`✨ Character B unleashes ${B.stats["Special Power"][0]}.`);

if(A.stats["Extra Power"][2]>B.stats["Extra Power"][2])

log.push(`💥 Character A turns the battle with ${A.stats["Extra Power"][0]}.`);

else

log.push(`💥 Character B turns the battle with ${B.stats["Extra Power"][0]}.`);

if(A.stats.Durability[2]>B.stats.Durability[2])

log.push("🛡️ Character A survives the punishment and keeps fighting.");

else if(B.stats.Durability[2]>A.stats.Durability[2])

log.push("🛡️ Character B survives the punishment and keeps fighting.");

let winner=Math.abs(a-b)<10?"DRAW":a>b?"A":"B";

if(winner==="DRAW"){

log.push("⚡ Neither fighter can secure the decisive advantage.");

out.innerHTML=`<div class="winner">⚡ DRAW</div><div class="battleLog">${log.join("<br><br>")}</div>`;

return;

}

log.push(`🏆 Character ${winner} lands the decisive finishing move.`);

out.innerHTML=

`<div class="winner">🏆 CHARACTER ${winner} WINS</div>

<div class="battleLog">${log.join("<br><br>")}</div>`;

}

</script>

</body>

</html>
