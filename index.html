<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wheel of Fate</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  background: #080812;

  color: white;

  font-family: Arial, sans-serif;

  text-align: center;

}

.app {

  max-width: 900px;

  margin: auto;

  padding: 18px;

}

h1 {

  font-size: 38px;

  margin: 8px 0;

}

.subtitle {

  color: #aaa;

  margin-bottom: 20px;

}

.card {

  background: #151522;

  border: 1px solid #29293d;

  border-radius: 20px;

  padding: 18px;

  margin: 18px 0;

}

button {

  background: #704cff;

  color: white;

  border: 0;

  border-radius: 12px;

  padding: 14px 18px;

  margin: 6px;

  font-weight: bold;

  font-size: 16px;

  cursor: pointer;

}

button:active {

  transform: scale(.97);

}

button:disabled {

  opacity: .5;

}

.wheel-area {

  position: relative;

  width: min(300px, 90vw);

  margin: 15px auto;

}

.pointer {

  position: relative;

  z-index: 10;

  font-size: 38px;

  line-height: 30px;

  height: 32px;

}

.wheel {

  width: min(290px, 82vw);

  aspect-ratio: 1 / 1;

  margin: auto;

  border-radius: 50%;

  border: 7px solid white;

  position: relative;

  overflow: hidden;

  box-shadow: 0 0 35px #704cff66;

  transition: transform 4s cubic-bezier(.12,.8,.16,1);

}

.emoji-layer {

  position: absolute;

  inset: 0;

  pointer-events: none;

}

.wheel-emoji {

  position: absolute;

  width: 42px;

  height: 42px;

  transform: translate(-50%, -50%);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 27px;

  z-index: 2;

  filter: drop-shadow(0 2px 3px #000);

}

.center {

  position: absolute;

  left: 50%;

  top: 50%;

  transform: translate(-50%, -50%);

  width: 64px;

  height: 64px;

  border-radius: 50%;

  background: #10101b;

  border: 4px solid white;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 12px;

  font-weight: bold;

  z-index: 5;

}

.result {

  min-height: 58px;

  font-size: 20px;

  font-weight: bold;

  margin: 12px;

}

.reveal {

  color: #ffd43b;

  font-size: 27px;

}

.options {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 7px;

  text-align: left;

  margin-top: 15px;

}

.option {

  background: #222235;

  padding: 10px;

  border-radius: 9px;

  font-size: 13px;

}

.option b {

  display: block;

}

.option span {

  color: #aaa;

}

.character-grid {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 8px;

}

.stat {

  background: #222235;

  padding: 12px;

  border-radius: 10px;

  text-align: left;

}

.stat small {

  color: #999;

}

.stat strong {

  display: block;

  margin-top: 3px;

  font-size: 17px;

}

.battle-log {

  text-align: left;

  background: #090910;

  border-radius: 12px;

  padding: 14px;

  line-height: 1.55;

  min-height: 80px;

}

.winner {

  font-size: 30px;

  color: #ffd43b;

}

@media (max-width: 600px) {

  h1 {

    font-size: 30px;

  }

  .options {

    grid-template-columns: 1fr;

  }

  .character-grid {

    grid-template-columns: 1fr;

  }

  button {

    width: 94%;

  }

}

</style>

</head>

<body>

<div class="app">

<h1>🎡 WHEEL OF FATE</h1>

<div class="subtitle">

Every spin could create something legendary.

</div>

<div class="card">

<h2 id="categoryTitle">Choose a character</h2>

<div class="pointer">▼</div>

<div class="wheel-area">

<div id="wheel" class="wheel">

<div id="emojiLayer" class="emoji-layer"></div>

<div class="center">

FATE

</div>

</div>

</div>

<div id="result" class="result">

Ready.

</div>

<button id="generateA" onclick="generate('A')">

🎡 Generate Character A

</button>

<button id="generateB" onclick="generate('B')">

🎡 Generate Character B

</button>

<div id="options"></div>

</div>

<div class="card">

<h2>🅰️ Character A</h2>

<div id="characterA" class="character-grid">

<div class="stat">Empty slot.</div>

</div>

</div>

<div class="card">

<h2>🅱️ Character B</h2>

<div id="characterB" class="character-grid">

<div class="stat">Empty slot.</div>

</div>

</div>

<div class="card">

<h2>⚔️ FATE BATTLE</h2>

<p>

Two characters enter. Only one leaves victorious.

</p>

<button onclick="battle()">

⚔️ LET THEM FIGHT

</button>

<div id="battleResult">

Generate both characters first.

</div>

</div>

</div>

<script>

/* =========================

   WHEEL DATA

========================= */

const categories = {

Race: [

  ["Human", 35, 10, "🧑"],

  ["Beastkin", 25, 20, "🐺"],

  ["Vampire", 18, 35, "🧛"],

  ["Dragon Tamer", 10, 55, "🐉"],

  ["Demigod", 6, 75, "⚡"],

  ["Celestial", 4, 100, "👼"],

  ["Eternal", 2, 130, "♾️"]

],

Strength: [

  ["Human Level", 35, 10, "🥊"],

  ["Superhuman", 25, 20, "💪"],

  ["Mountain Level", 18, 35, "⛰️"],

  ["Continental", 10, 55, "🌎"],

  ["Planetary", 6, 75, "🪐"],

  ["Universal", 4, 100, "🌌"],

  ["Omnipotent", 2, 140, "👑"]

],

Speed: [

  ["Human Speed", 35, 10, "🚶"],

  ["Superhuman", 25, 20, "🏃"],

  ["Hypersonic", 18, 35, "💨"],

  ["Relativistic", 10, 55, "⚡"],

  ["FTL", 6, 75, "🌠"],

  ["Massively FTL", 4, 100, "✨"],

  ["Immeasurable", 2, 140, "♾️"]

],

IQ: [

  ["Average", 35, 10, "🧠"],

  ["Genius", 25, 20, "📚"],

  ["Supergenius", 18, 35, "🎓"],

  ["Nigh Omniscient", 10, 55, "🔮"],

  ["Omniscient", 6, 75, "👁️"],

  ["Transcendent", 4, 100, "🌌"],

  ["Cosmic Omniscience", 2, 140, "♾️"]

],

Durability: [

  ["Human", 35, 10, "🩹"],

  ["Superhuman", 25, 20, "🛡️"],

  ["City Level", 18, 35, "🏙️"],

  ["Planetary", 10, 55, "🌎"],

  ["Universal", 6, 75, "🌌"],

  ["Multiversal", 4, 100, "🌐"],

  ["Boundless", 2, 140, "♾️"]

],

"Special Power": [

  ["Shadowstep", 30, 10, "🌑"],

  ["Elemental Fury", 25, 20, "🔥"],

  ["Soul Manipulation", 18, 35, "👻"],

  ["Time Bending", 10, 55, "⏳"],

  ["Space Manipulation", 6, 75, "🌌"],

  ["Reality Warping", 4, 100, "🌀"],

  ["Fate Manipulation", 2, 150, "🎡"]

],

"Extra Power": [

  ["Enhanced Reflexes", 30, 10, "⚡"],

  ["Regeneration", 25, 20, "💚"],

  ["Illusion Casting", 18, 35, "🪞"],

  ["Telekinesis", 10, 55, "🌀"],

  ["Energy Absorption", 6, 75, "☄️"],

  ["Dimensional Control", 4, 100, "🌌"],

  ["Causality Break", 2, 150, "💫"]

],

"Power Reserves": [

  ["Flicker", 35, 10, "🕯️"],

  ["Spark", 25, 20, "✨"],

  ["Deep Well", 18, 35, "💧"],

  ["Overcharged", 10, 55, "🔋"],

  ["Bottomless", 6, 75, "⚡"],

  ["Infinite", 4, 100, "♾️"],

  ["Limitless", 2, 140, "🌌"]

],

"Fight Skill": [

  ["Amateur", 35, 10, "🥋"],

  ["Scrapper", 25, 20, "👊"],

  ["Trained Fighter", 18, 35, "🥊"],

  ["Elite Warrior", 10, 55, "⚔️"],

  ["Master", 6, 75, "🏆"],

  ["Grandmaster", 4, 100, "👑"],

  ["Perfect Combatant", 2, 140, "💀"]

]

};

const order = [

  "Race",

  "Strength",

  "Speed",

  "IQ",

  "Durability",

  "Special Power",

  "Extra Power",

  "Power Reserves",

  "Fight Skill"

];

let characters = {

  A: null,

  B: null

};

let spinning = false;

/* =========================

   WEIGHTED RANDOM

========================= */

function weightedPick(list) {

  const total = list.reduce(

    (sum, item) => sum + item[1],

    0

  );

  let random = Math.random() * total;

  for (const item of list) {

    random -= item[1];

    if (random <= 0) {

      return item;

    }

  }

  return list[list.length - 1];

}

/* =========================

   SHOW ODDS

========================= */

function showOptions(category) {

  const list = categories[category];

  let html =

    "<h3>🎯 Current Wheel Odds</h3>" +

    "<div class='options'>";

  for (const item of list) {

    html += `

      <div class="option">

        <b>${item[3]} ${item[0]}</b>

        <span>${item[1]}% chance</span>

      </div>

    `;

  }

  html += "</div>";

  document.getElementById("options").innerHTML = html;

}

/* =========================

   DRAW WHEEL

========================= */

function drawWheel(category) {

  const list = categories[category];

  let start = 0;

  let parts = [];

  let emojis = "";

  for (const item of list) {

    const end =

      start + (item[1] / 100) * 360;

    parts.push(

      `hsl(${start},75%,55%) ${start}deg ${end}deg`

    );

    /*

       Find the exact middle of this segment.

       This is what keeps the emoji centered.

    */

    const middle =

      (start + end) / 2;

    const wheel =

      document.getElementById("wheel");

    const size =

      wheel.getBoundingClientRect().width;

    const center =

      size / 2;

    const radius =

      size * 0.36;

    const angle =

      (middle - 90) * Math.PI / 180;

    const x =

      center + Math.cos(angle) * radius;

    const y =

      center + Math.sin(angle) * radius;

    emojis += `

      <div

        class="wheel-emoji"

        style="

          left:${x}px;

          top:${y}px;

        "

      >

        ${item[3]}

      </div>

    `;

    start = end;

  }

  wheel.style.background =

    `conic-gradient(${parts.join(",")})`;

  document.getElementById("emojiLayer").innerHTML =

    emojis;

}

/* =========================

   DISPLAY CHARACTER

========================= */

function displayCharacter(slot) {

  const character =

    characters[slot];

  let html = "";

  for (const category of order) {

    const stat =

      character.stats[category];

    if (!stat) continue;

    html += `

      <div class="stat">

        <small>${category}</small>

        <strong>

          ${stat[3]} ${stat[0]}

        </strong>

      </div>

    `;

  }

  document.getElementById(

    "character" + slot

  ).innerHTML = html;

}

/* =========================

   GENERATE CHARACTER

========================= */

function generate(slot) {

  if (spinning) return;

  spinning = true;

  characters[slot] = {

    stats: {}

  };

  document.getElementById(

    "generateA"

  ).disabled = true;

  document.getElementById(

    "generateB"

  ).disabled = true;

  document.getElementById(

    "categoryTitle"

  ).textContent =

    "Generating Character " + slot;

  runSpin(slot, 0);

}

/* =========================

   SPIN

========================= */

function runSpin(slot, index) {

  if (index >= order.length) {

    spinning = false;

    document.getElementById(

      "generateA"

    ).disabled = false;

    document.getElementById(

      "generateB"

    ).disabled = false;

    document.getElementById(

      "categoryTitle"

    ).textContent =

      "Character " + slot + " Complete";

    document.getElementById(

      "result"

    ).innerHTML =

      `<span class="reveal">🔥 FATE HAS SPOKEN.</span>`;

    displayCharacter(slot);

    return;

  }

  const category =

    order[index];

  const list =

    categories[category];

  /*

     Pick the actual winning item FIRST.

     The wheel will then be rotated to that

     exact item's segment.

  */

  const chosen =

    weightedPick(list);

  drawWheel(category);

  showOptions(category);

  document.getElementById(

    "categoryTitle"

  ).textContent = category;

  document.getElementById(

    "result"

  ).textContent =

    "THE WHEEL IS SPINNING...";

  const wheel =

    document.getElementById("wheel");

  /*

     Find the selected segment's center.

  */

  let start = 0;

  let chosenMiddle = 0;

  for (const item of list) {

    const end =

      start + (item[1] / 100) * 360;

    if (item === chosen) {

      chosenMiddle =

        (start + end) / 2;

      break;

    }

    start = end;

  }

  /*

     The pointer is at the top.

     The top of a conic-gradient is -90°.

     We rotate the selected segment's center

     to that exact pointer position.

  */

  const targetRotation =

    360 - chosenMiddle;

  const extraSpins =

    360 * (4 + Math.floor(Math.random() * 3));

  const finalRotation =

    extraSpins + targetRotation;

  wheel.style.transition = "none";

  wheel.style.transform =

    "rotate(0deg)";

  void wheel.offsetWidth;

  wheel.style.transition =

    "transform 4s cubic-bezier(.12,.8,.16,1)";

  wheel.style.transform =

    `rotate(${finalRotation}deg)`;

  setTimeout(() => {

    characters[slot].stats[category] =

      chosen;

    document.getElementById(

      "result"

    ).innerHTML = `

      <span class="reveal">

        ${chosen[3]} ${chosen[0]}

      </span>

      <br>

      ${chosen[1]}% chance

    `;

    displayCharacter(slot);

    setTimeout(() => {

      runSpin(slot, index + 1);

    }, 1000);

  }, 4100);

}

/* =========================

   BATTLE

========================= */

function battle() {

  const A = characters.A;

  const B = characters.B;

  const output =

    document.getElementById(

      "battleResult"

    );

  if (

    !A ||

    !B ||

    Object.keys(A.stats).length < 9 ||

    Object.keys(B.stats).length < 9

  ) {

    output.innerHTML =

      "<p>Both characters must finish generating first.</p>";

    return;

  }

  let a = 0;

  let b = 0;

  let log = [];

  /*

     Combat weighting

  */

  a += A.stats.Strength[2];

  b += B.stats.Strength[2];

  a += A.stats.Speed[2] * 1.35;

  b += B.stats.Speed[2] * 1.35;

  a += A.stats.Durability[2];

  b += B.stats.Durability[2];

  a += A.stats.IQ[2] * 0.7;

  b += B.stats.IQ[2] * 0.7;

  a += A.stats["Fight Skill"][2] * 1.3;

  b += B.stats["Fight Skill"][2] * 1.3;

  a += A.stats["Special Power"][2] * 1.3;

  b += B.stats["Special Power"][2] * 1.3;

  a += A.stats["Extra Power"][2];

  b += B.stats["Extra Power"][2];

  a += A.stats["Power Reserves"][2] * 0.8;

  b += B.stats["Power Reserves"][2] * 0.8;

  a += A.stats.Race[2] * 0.8;

  b += B.stats.Race[2] * 0.8;

  /*

     Small randomness so battles aren't completely

     predetermined.

  */

  a *= 0.9 + Math.random() * 0.2;

  b *= 0.9 + Math.random() * 0.2;

  log.push(

    `⚔️ The battle begins: ${A.stats.Race[3]} ${A.stats.Race[0]} vs ${B.stats.Race[3]} ${B.stats.Race[0]}.`

  );

  if (

    A.stats.Speed[2] >

    B.stats.Speed[2]

  ) {

    log.push(

      `⚡ Character A has the speed advantage with ${A.stats.Speed[0]}.`

    );

  } else if (

    B.stats.Speed[2] >

    A.stats.Speed[2]

  ) {

    log.push(

      `⚡ Character B has the speed advantage with ${B.stats.Speed[0]}.`

    );

  } else {

    log.push(

      "⚡ Their speed is evenly matched."

    );

  }

  if (

    A.stats["Fight Skill"][2] >

    B.stats["Fight Skill"][2]

  ) {

    log.push(

      `🥋 Character A's ${A.stats["Fight Skill"][0]} skill controls the fight.`

    );

  } else if (

    B.stats["Fight Skill"][2] >

    A.stats["Fight Skill"][2]

  ) {

    log.push(

      `🥋 Character B's ${B.stats["Fight Skill"][0]} skill controls the fight.`

    );

  }

  if (

    A.stats["Special Power"][2] >

    B.stats["Special Power"][2]

  ) {

    log.push(

      `✨ Character A unleashes ${A.stats["Special Power"][0]}.`

    );

  } else {

    log.push(

      `✨ Character B unleashes ${B.stats["Special Power"][0]}.`

    );

  }

  if (

    A.stats["Extra Power"][2] >

    B.stats["Extra Power"][2]

  ) {

    log.push(

      `💥 Character A changes the momentum with ${A.stats["Extra Power"][0]}.`

    );

  } else {

    log.push(

      `💥 Character B changes the momentum with ${B.stats["Extra Power"][0]}.`

    );

  }

  if (

    A.stats.Durability[2] >

    B.stats.Durability[2]

  ) {

    log.push(

      `🛡️ Character A withstands the punishment with ${A.stats.Durability[0]} durability.`

    );

  } else if (

    B.stats.Durability[2] >

    A.stats.Durability[2]

  ) {

    log.push(

      `🛡️ Character B withstands the punishment with ${B.stats.Durability[0]} durability.`

    );

  }

  let winner;

  if (Math.abs(a - b) < 10) {

    winner = "DRAW";

  } else if (a > b) {

    winner = "A";

  } else {

    winner = "B";

  }

  if (winner === "DRAW") {

    log.push(

      "⚡ Neither fighter can secure the decisive advantage."

    );

    output.innerHTML = `

      <div class="winner">

        ⚡ DRAW

      </div>

      <div class="battle-log">

        ${log.join("<br><br>")}

      </div>

    `;

    return;

  }

  log.push(

    `🏆 Character ${winner} lands the decisive finishing move.`

  );

  output.innerHTML = `

    <div class="winner">

      🏆 CHARACTER ${winner} WINS

    </div>

    <div class="battle-log">

      ${log.join("<br><br>")}

    </div>

  `;

}

</script>

</body>

</html>
