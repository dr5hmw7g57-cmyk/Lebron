<title>Wheel of Fate</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  background:#070710;

  color:#fff;

  font-family:Arial,sans-serif;

  text-align:center;

}

.app{

  width:min(950px,100%);

  margin:auto;

  padding:16px;

}

h1{

  font-size:38px;

  margin:8px 0;

}

.subtitle{

  color:#aaa;

  margin-bottom:20px;

}

.card{

  background:#151522;

  border:1px solid #29293d;

  border-radius:20px;

  padding:18px;

  margin:18px 0;

}

button{

  background:#704cff;

  color:#fff;

  border:0;

  border-radius:12px;

  padding:14px 18px;

  margin:6px;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

}

button:disabled{

  opacity:.45;

}

.secondary{

  background:#29293d;

}

.pointer{

  font-size:38px;

  line-height:32px;

  position:relative;

  z-index:10;

}

.wheelWrap{

  position:relative;

  width:310px;

  height:310px;

  margin:12px auto;

}

.wheel{

  position:relative;

  width:290px;

  height:290px;

  margin:auto;

  border-radius:50%;

  border:7px solid white;

  overflow:hidden;

  box-shadow:0 0 35px #704cff77;

  transition:transform 4.2s cubic-bezier(.12,.8,.16,1);

}

.emojiLayer{

  position:absolute;

  inset:0;

  pointer-events:none;

}

.wheelEmoji{

  position:absolute;

  width:44px;

  height:44px;

  display:flex;

  justify-content:center;

  align-items:center;

  transform:translate(-50%,-50%);

  font-size:27px;

  text-shadow:0 2px 4px #000;

}

.wheelCenter{

  position:absolute;

  z-index:5;

  left:50%;

  top:50%;

  transform:translate(-50%,-50%);

  width:68px;

  height:68px;

  border-radius:50%;

  background:#10101b;

  border:4px solid white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:12px;

  font-weight:bold;

}

.result{

  min-height:62px;

  margin:12px;

  font-size:20px;

  font-weight:bold;

}

.reveal{

  color:#ffd43b;

  font-size:28px;

}

.odds{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

  text-align:left;

}

.option{

  background:#222235;

  padding:10px;

  border-radius:10px;

}

.option b{

  display:block;

}

.option span{

  color:#aaa;

  font-size:13px;

}

.characterGrid{

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:8px;

}

.stat{

  background:#222235;

  padding:12px;

  border-radius:10px;

  text-align:left;

}

.stat small{

  color:#999;

}

.stat strong{

  display:block;

  margin-top:4px;

  font-size:17px;

}

.battleLog{

  text-align:left;

  background:#090910;

  padding:15px;

  border-radius:12px;

  line-height:1.6;

}

.winner{

  font-size:30px;

  color:#ffd43b;

}

.history{

  text-align:left;

  background:#0b0b14;

  border-radius:12px;

  padding:12px;

  margin-top:12px;

  max-height:300px;

  overflow:auto;

}

.historyItem{

  padding:8px 0;

  border-bottom:1px solid #242436;

}

.badge{

  display:inline-block;

  padding:5px 8px;

  margin:3px;

  border-radius:8px;

  background:#29293d;

  font-size:12px;

}

@media(max-width:600px){

  h1{font-size:30px}

  .wheelWrap{

    width:285px;

    height:285px;

  }

  .wheel{

    height:270px;

  }

  .odds,

  .characterGrid{

    grid-template-columns:1fr;

  }

  button{

    width:94%;

  }

}

========================================================= */

A:null,

B:null

};

let spinning=false;

/* =========================================================

   WEIGHTED PICK

========================================================= */

function pick(list){

  const total=list.reduce((sum,item)=>sum+item[1],0);

  let r=Math.random()*total;

  for(const item of list){

    r-=item[1];

    if(r<=0)return item;

  }

  return list[list.length-1];

}

/* =========================================================

   DRAW CURRENT WHEEL

========================================================= */

function drawWheel(category){

  const list=wheels[category];

  const wheel=document.getElementById("wheel");

  const emojiLayer=document.getElementById("emojiLayer");

  let start=0;

  let parts=[];

  let emojis="";

  const size=290;

  const center=size/2;

  const radius=105;

  list.forEach((item,index)=>{

    const degrees=(item[1]/100)*360;

    const end=start+degrees;

    parts.push(

      `hsl(${index*37%360},75%,55%) ${start}deg ${end}deg`

    );

    const middle=(start+end)/2;

    const rad=(middle-90)*Math.PI/180;

    const left=center+Math.cos(rad)*radius;

    const top=center+Math.sin(rad)*radius;

    emojis+=`

      <div

        class="wheelEmoji"

        style="left:${left}px;top:${top}px"

      >${item[3]}</div>

    `;

    start=end;

  });

  wheel.style.background=

    `conic-gradient(${parts.join(",")})`;

  emojiLayer.innerHTML=emojis;

}

/* =========================================================

   SHOW ODDS

========================================================= */

function showOdds(category){

  const list=wheels[category];

  let html=`

    <h3>🎯 ${category} — Odds</h3>

    <div class="odds">

  `;

  list.forEach(item=>{

    html+=`

      <div class="option">

        <b>${item[3]} ${item[0]}</b>

        <span>${item[1]}% chance</span>

      </div>

    `;

  });

  html+=`</div>`;

  document.getElementById("odds").innerHTML=html;

}

/* =========================================================

   DISPLAY CHARACTER

========================================================= */

function displayCharacter(slot){

  const character=characters[slot];

  if(!character)return;

  let html="";

  character.results.forEach(item=>{

    html+=`

      <div class="stat">

        <small>${item.category}</small>

        <strong>

          ${item.choice[3]} ${item.choice[0]}

        </strong>

      </div>

    `;

  });

  document.getElementById("character"+slot).innerHTML=html;

}

/* =========================================================

   START CHARACTER

========================================================= */

function startCharacter(slot){

  if(spinning)return;

  characters[slot]={

    slot:slot,

    results:[],

    conditionalQueue:[]

  };

  document.getElementById("character"+slot).innerHTML=

    `<div class="stat">Generating...</div>`;

  document.getElementById("battleResult").innerHTML=

    "Generate both characters first.";

  document.getElementById("generateA").disabled=true;

  document.getElementById("generateB").disabled=true;

  spinning=true;

  runWheel(slot,0);

}

/* =========================================================

   RUN WHEELS

========================================================= */

function runWheel(slot,index){

  const character=characters[slot];

  if(index>=baseOrder.length){

    buildConditionalQueue(character);

    runConditional(slot,0);

    return;

  }

  const category=baseOrder[index];

  spinCategory(

    slot,

    category,

    ()=>runWheel(slot,index+1)

  );

}

/* =========================================================

   CONDITIONAL QUEUE

========================================================= */

function buildConditionalQueue(character){

  const archetype=

    character.results.find(

      x=>x.category==="Archetype"

    );

  const race=

    character.results.find(

      x=>x.category==="Race"

    );

  if(archetype && conditional[archetype.choice[0]]){

    conditional[archetype.choice[0]].forEach(x=>{

      character.conditionalQueue.push(x);

    });

  }

  if(race && conditional[race.choice[0]]){

    conditional[race.choice[0]].forEach(x=>{

      if(!character.conditionalQueue.includes(x)){

        character.conditionalQueue.push(x);

      }

    });

  }

}

/* =========================================================

   CONDITIONAL WHEELS

========================================================= */

function runConditional(slot,index){

  const character=characters[slot];

  if(index>=character.conditionalQueue.length){

    finishCharacter(slot);

    return;

  }

  const category=character.conditionalQueue[index];

  spinCategory(

    slot,

    category,

    ()=>runConditional(slot,index+1)

  );

}

/* =========================================================

   ONE SPIN

========================================================= */

function spinCategory(slot,category,callback){

  const character=characters[slot];

  const chosen=pick(wheels[category]);

  drawWheel(category);

  showOdds(category);

  document.getElementById("wheelTitle").textContent=

    `Character ${slot} — ${category}`;

  document.getElementById("result").innerHTML=

    `🎡 THE WHEEL IS SPINNING...`;

  const wheel=document.getElementById("wheel");

  wheel.style.transition="none";

  wheel.style.transform="rotate(0deg)";

  void wheel.offsetWidth;

  wheel.style.transition=

    "transform 4.2s cubic-bezier(.12,.8,.16,1)";

  const rotations=

    2160+

    Math.floor(Math.random()*1080);

  wheel.style.transform=

    `rotate(${rotations}deg)`;

  setTimeout(()=>{

    character.results.push({

      category:category,

      choice:chosen

    });

    displayCharacter(slot);

    document.getElementById("result").innerHTML=`

      <span class="reveal">

        ${chosen[3]} ${chosen[0]}

      </span>

      <br>

      ${chosen[1]}% chance

    `;

    setTimeout(callback,850);

  },4300);

}

/* =========================================================

   FINISH

========================================================= */

function finishCharacter(slot){

  spinning=false;

  document.getElementById("wheelTitle").textContent=

    `Character ${slot} Complete`;

  document.getElementById("result").innerHTML=

    `<span class="reveal">🔥 FATE HAS SPOKEN.</span>`;

  displayCharacter(slot);

  document.getElementById("generateA").disabled=false;

  document.getElementById("generateB").disabled=false;

}

/* =========================================================

   GET VALUE

========================================================= */

function value(character,category){

  const result=character.results.find(

    x=>x.category===category

  );

  return result ? result.choice[2] : 0;

}

/* =========================================================

   GET NAME

========================================================= */

function nameOf(character,category){

  const result=character.results.find(

    x=>x.category===category

  );

  return result ? result.choice[0] : "Unknown";

}

/* =========================================================

   BATTLE

========================================================= */

function battle(){

  const A=characters.A;

  const B=characters.B;

  const output=document.getElementById("battleResult");

  if(

    !A ||

    !B ||

    A.results.length===0 ||

    B.results.length===0

  ){

    output.innerHTML=

      `<p>Both characters must be generated first.</p>`;

    return;

  }

  let a=0;

  let b=0;

  let log=[];

  /* CORE STATS */

  a+=value(A,"Strength");

  b+=value(B,"Strength");

  a+=value(A,"Speed")*1.25;

  b+=value(B,"Speed")*1.25;

  a+=value(A,"Durability");

  b+=value(B,"Durability");

  a+=value(A,"IQ")*.65;

  b+=value(B,"IQ")*.65;

  a+=value(A,"Battle/Fighting")*1.35;

  b+=value(B,"Battle/Fighting")*1.35;

  /* RACE / CLASS */

  a+=value(A,"Race")*.7;

  b+=value(B,"Race")*.7;

  a+=value(A,"Archetype")*.7;

  b+=value(B,"Archetype")*.7;

  /* POWERS */

  a+=value(A,"Core Powers")*1.35;

  b+=value(B,"Core Powers")*1.35;

  /* CONDITIONAL POWER */

  A.results.forEach(x=>{

    if(

      !baseOrder.includes(x.category)

    ){

      a+=Math.max(0,x.choice[2])*.8;

    }

  });

  B.results.forEach(x=>{

    if(

      !baseOrder.includes(x.category)

    ){

      b+=Math.max(0,x.choice[2])*.8;

    }

  });

  /* CHAOS */

  a+=value(A,"Modifiers & Chaos");

  b+=value(B,"Modifiers & Chaos");

  /* SMALL RANDOM ELEMENT */

  a*=.9+Math.random()*.2;

  b*=.9+Math.random()*.2;

  log.push(

    `⚔️ ${nameOf(A,"Race")} faces ${nameOf(B,"Race")}.`

  );

  if(value(A,"Speed")>value(B,"Speed")){

    log.push(

      `⚡ Character A strikes first with ${nameOf(A,"Speed")} speed.`

    );

  }else if(value(B,"Speed")>value(A,"Speed")){

    log.push(

      `⚡ Character B strikes first with ${nameOf(B,"Speed")} speed.`

    );

  }else{

    log.push(

      `⚡ Their speed is evenly matched.`

    );

  }

  if(value(A,"Battle/Fighting")>

     value(B,"Battle/Fighting")){

    log.push(

      `🥋 Character A has the superior combat technique.`

    );

  }else if(value(B,"Battle/Fighting")>

          value(A,"Battle/Fighting")){

    log.push(

      `🥋 Character B has the superior combat technique.`

    );

  }

  if(value(A,"Core Powers")>

     value(B,"Core Powers")){

    log.push(

      `✨ Character A unleashes ${nameOf(A,"Core Powers")}.`

    );

  }else if(value(B,"Core Powers")>

          value(A,"Core Powers")){

    log.push(

      `✨ Character B unleashes ${nameOf(B,"Core Powers")}.`

    );

  }else{

    log.push(

      `✨ Both fighters reveal equally dangerous powers.`

    );

  }

  if(value(A,"Durability")>

     value(B,"Durability")){

    log.push(

      `🛡️ Character A withstands the attack.`

    );

  }else if(value(B,"Durability")>

          value(A,"Durability")){

    log.push(

      `🛡️ Character B withstands the attack.`

    );

  }

  const difference=Math.abs(a-b);

  let winner;

  if(difference<12){

    winner="DRAW";

  }else{

    winner=a>b?"A":"B";

  }

  if(winner==="DRAW"){

    log.push(

      `⚡ Neither fighter can gain a decisive advantage.`

    );

    output.innerHTML=`

      <div class="winner">⚡ DRAW</div>

      <div class="battleLog">

        ${log.join("<br><br>")}

      </div>

    `;

    return;

  }

  log.push(

    `🏆 Character ${winner} finds the decisive opening.`

  );

  output.innerHTML=`

    <div class="winner">

      🏆 CHARACTER ${winner} WINS

    </div>

    <div class="battleLog">

      ${log.join("<br><br>")}

    </div>

  `;

}

   INITIAL WHEEL

========================================================= */

drawWheel("Race");

showOdds("Race");

</script>
